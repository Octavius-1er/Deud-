<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Deudé – Animation 2D</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #1a1a2e;
      --panel:    #16213e;
      --surface:  #0f3460;
      --accent:   #e94560;
      --accent2:  #f5a623;
      --text:     #eaeaea;
      --muted:    #7a8494;
      --border:   #2a3a5c;
      --radius:   10px;
      --toolbar-h: 56px;
      --bottom-h:  80px;
    }
    html, body {
      height: 100%; width: 100%;
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden; touch-action: none;
    }
    #app { display: flex; flex-direction: column; height: 100dvh; width: 100%; }

    /* TOP TOOLBAR */
    #toolbar {
      display: flex; align-items: center; gap: 6px;
      padding: 0 10px; height: var(--toolbar-h);
      background: var(--panel); border-bottom: 1px solid var(--border);
      overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
      flex-shrink: 0; z-index: 10;
    }
    #toolbar::-webkit-scrollbar { display: none; }
    .logo {
      font-size: 1.3rem; font-weight: 900; letter-spacing: 2px;
      color: var(--accent); margin-right: 8px; white-space: nowrap;
      text-shadow: 0 0 12px #e9456066;
    }
    .sep { width: 1px; height: 30px; background: var(--border); flex-shrink: 0; margin: 0 4px; }
    .tool-btn {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2px; min-width: 44px; height: 40px;
      border: none; border-radius: var(--radius); background: transparent;
      color: var(--muted); font-size: 0.6rem; cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
      flex-shrink: 0; padding: 0 6px; -webkit-tap-highlight-color: transparent;
    }
    .tool-btn svg { flex-shrink: 0; }
    .tool-btn:hover  { background: var(--surface); color: var(--text); }
    .tool-btn:active { transform: scale(0.92); }
    .tool-btn.active { background: var(--accent); color: #fff; box-shadow: 0 0 10px #e9456055; }
    #colorSwatch {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid var(--border); cursor: pointer; flex-shrink: 0;
      transition: border-color 0.2s; overflow: hidden; position: relative;
    }
    #colorSwatch:hover { border-color: var(--accent); }
    #colorSwatch input[type=color] {
      position: absolute; inset: -4px; width: 140%; height: 140%;
      opacity: 0; cursor: pointer; border: none; padding: 0;
    }
    .size-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .size-group label { font-size: 0.65rem; color: var(--muted); white-space: nowrap; }
    input[type=range] {
      -webkit-appearance: none; width: 70px; height: 4px;
      background: var(--surface); border-radius: 2px; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--accent); border: 2px solid #fff;
    }

    /* MAIN */
    #main { flex: 1; display: flex; overflow: hidden; position: relative; }
    #canvas-zone {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #1e2a45 0%, var(--bg) 100%);
      overflow: hidden; position: relative;
    }
    #canvas-wrap {
      position: relative; box-shadow: 0 8px 40px #00000088;
      border-radius: 4px; overflow: hidden; border: 2px solid var(--border);
    }
    #bgCanvas, #onionCanvas, #drawCanvas {
      display: block; position: absolute; top: 0; left: 0;
    }
    #bgCanvas    { z-index: 1; }
    #onionCanvas { z-index: 2; }
    #drawCanvas  { z-index: 3; background: transparent; }

    /* TIMELINE */
    #timeline {
      height: var(--bottom-h); background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
      padding: 0 10px; overflow-x: auto; overflow-y: hidden;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent; flex-shrink: 0;
    }
    .frame-thumb {
      flex-shrink: 0; width: 54px; height: 60px; border-radius: 6px;
      border: 2px solid var(--border); background: #fff; cursor: pointer;
      transition: border-color 0.15s, transform 0.1s; position: relative; overflow: hidden;
    }
    .frame-thumb:hover  { border-color: var(--accent2); transform: translateY(-2px); }
    .frame-thumb.active { border-color: var(--accent); box-shadow: 0 0 10px #e9456066; }
    .frame-thumb canvas { width: 100%; height: 100%; display: block; }
    .frame-num {
      position: absolute; bottom: 2px; right: 4px;
      font-size: 0.55rem; color: var(--muted);
      background: #000a; padding: 1px 3px; border-radius: 3px;
    }
    .frame-del {
      position: absolute; top: 1px; right: 1px;
      font-size: 0.6rem; line-height: 1;
      background: var(--accent); color: #fff;
      border: none; border-radius: 3px; padding: 1px 3px; cursor: pointer; display: none;
    }
    .frame-thumb:hover .frame-del { display: block; }
    #addFrameBtn {
      flex-shrink: 0; width: 46px; height: 60px; border-radius: 6px;
      border: 2px dashed var(--border); background: transparent;
      color: var(--muted); font-size: 1.6rem; cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    #addFrameBtn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* PLAYBACK BAR */
    #playbar {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; background: var(--panel);
      border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .play-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--accent); color: #fff; cursor: pointer;
      transition: background 0.15s, transform 0.1s; flex-shrink: 0;
    }
    .play-btn:hover  { background: #c73450; }
    .play-btn:active { transform: scale(0.9); }
    #fpsLabel { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
    #fpsInput {
      width: 38px; font-size: 0.75rem; background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px; text-align: center;
    }
    #frameCounter { font-size: 0.72rem; color: var(--muted); margin-left: 4px; }
    .spacer { flex: 1; }
    #exportBtn {
      display: flex; align-items: center; gap: 5px; padding: 6px 12px;
      border-radius: var(--radius); border: none; background: var(--surface);
      color: var(--accent2); font-size: 0.75rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    #exportBtn:hover { background: #1a4a7a; }

    /* MODAL */
    .modal-bg {
      display: none; position: fixed; inset: 0; background: #000b;
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px; max-width: 340px; width: 90%; text-align: center;
    }
    .modal h2 { margin-bottom: 12px; color: var(--accent2); }
    .modal p  { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
    .modal-btns { display: flex; gap: 10px; justify-content: center; }
    .modal-btn {
      padding: 8px 18px; border-radius: 8px; border: none;
      font-size: 0.85rem; cursor: pointer; font-weight: 600;
    }
    .modal-btn.primary   { background: var(--accent); color: #fff; }
    .modal-btn.secondary { background: var(--surface); color: var(--text); }
    .modal-btn:disabled  { opacity: 0.4; cursor: not-allowed; }

    /* PROGRESS */
    .progress-track {
      width: 100%; height: 10px; background: var(--border);
      border-radius: 5px; overflow: hidden; margin: 16px 0 8px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 5px; width: 0%; transition: width 0.25s ease;
    }
    #exportProgLabel { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
    #exportProgPercent { font-size: 1rem; font-weight: 700; color: var(--accent2); margin: 4px 0 0; }

    /* TOAST */
    #toast {
      position: fixed; bottom: 110px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #222e; color: #fff;
      padding: 8px 18px; border-radius: 20px;
      font-size: 0.8rem; pointer-events: none;
      opacity: 0; transition: opacity 0.3s, transform 0.3s;
      z-index: 200; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      :root { --toolbar-h: 50px; --bottom-h: 70px; }
      .logo { font-size: 1.05rem; }
      .tool-btn { min-width: 38px; font-size: 0.55rem; }
      #exportBtn span { display: none; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- TOP TOOLBAR -->
  <div id="toolbar">
    <span class="logo">Deudé</span>
    <div class="sep"></div>

    <button class="tool-btn active" id="toolPen" title="Crayon (P)" onclick="setTool('pen')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Crayon
    </button>
    <button class="tool-btn" id="toolBrush" title="Pinceau (B)" onclick="setTool('brush')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 114.03 4.03l-8.06 8.08"/><path d="M7.07 14.94C5.79 16.2 4 16.72 2 17c.5-2 1.06-3.8 2.38-5.07"/></svg>
      Pinceau
    </button>
    <button class="tool-btn" id="toolLine" title="Ligne (L)" onclick="setTool('line')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="19" x2="19" y2="5"/></svg>
      Ligne
    </button>
    <button class="tool-btn" id="toolRect" title="Rectangle (R)" onclick="setTool('rect')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      Rect
    </button>
    <button class="tool-btn" id="toolCircle" title="Cercle (C)" onclick="setTool('circle')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/></svg>
      Cercle
    </button>
    <button class="tool-btn" id="toolFill" title="Remplissage (F)" onclick="setTool('fill')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 11l-8-8-8.5 8.5a5.5 5.5 0 007.78 7.78L19 11z"/><path d="M20 23a2 2 0 000-4c-.5 0-1.1.5-2 1.5s-.5 2.5.5 2.5a2 2 0 001.5 0z"/></svg>
      Fill
    </button>
    <button class="tool-btn" id="toolEraser" title="Gomme (E)" onclick="setTool('eraser')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 20H7L3 16l11-11 6 6-3.5 3.5"/><path d="M6.07 7.07L19 20"/></svg>
      Gomme
    </button>

    <div class="sep"></div>

    <div id="colorSwatch" title="Couleur">
      <input type="color" id="colorPicker" value="#222222" onchange="setColor(this.value)" oninput="setColor(this.value)">
    </div>

    <button class="tool-btn" id="bgColorBtn" title="Couleur fond" onclick="document.getElementById('bgPicker').click()" style="position:relative">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="20" height="20" rx="3"/></svg>
      Fond
      <input type="color" id="bgPicker" value="#ffffff" onchange="setBgColor(this.value)" style="position:absolute;inset:0;opacity:0;cursor:pointer">
    </button>

    <div class="sep"></div>

    <div class="size-group">
      <label>Taille</label>
      <input type="range" id="sizeSlider" min="1" max="60" value="4" oninput="setSize(this.value)">
    </div>

    <div class="sep"></div>

    <button class="tool-btn" title="Annuler (Ctrl+Z)" onclick="undo()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
      Annuler
    </button>
    <button class="tool-btn" title="Rétablir (Ctrl+Y)" onclick="redo()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3L21 13"/></svg>
      Rétablir
    </button>
    <button class="tool-btn" title="Effacer l'image" onclick="confirmClear()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Effacer
    </button>
    <button class="tool-btn" id="onionBtn" title="Pelure d'oignon" onclick="toggleOnion()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><ellipse cx="12" cy="12" rx="8" ry="10"/><ellipse cx="12" cy="12" rx="4" ry="6"/></svg>
      Pelure
    </button>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="canvas-zone">
      <div id="canvas-wrap">
        <canvas id="bgCanvas"></canvas>
        <canvas id="onionCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- TIMELINE -->
  <div id="timeline">
    <div id="frames-list" style="display:flex;gap:8px;align-items:center;"></div>
    <button id="addFrameBtn" title="Ajouter une image" onclick="addFrame()">+</button>
  </div>

  <!-- PLAYBACK BAR -->
  <div id="playbar">
    <button class="play-btn" title="Image précédente" onclick="goPrev()" style="background:var(--surface);color:var(--text)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="4" x2="5" y2="20" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="play-btn" id="playBtn" title="Lecture (Espace)" onclick="togglePlay()">
      <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
    <button class="play-btn" title="Image suivante" onclick="goNext()" style="background:var(--surface);color:var(--text)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <span id="frameCounter">1 / 1</span>
    <span class="spacer"></span>
    <label id="fpsLabel">FPS <input type="number" id="fpsInput" min="1" max="30" value="8"></label>
    <span style="font-size:0.7rem;color:var(--muted)">Pelure</span>
    <label style="display:flex;align-items:center;cursor:pointer;gap:4px">
      <input type="checkbox" id="onionCheck" onchange="toggleOnion(this.checked)" style="accent-color:var(--accent2)">
    </label>
    <span class="spacer"></span>
    <button id="exportBtn" title="Exporter" onclick="showExportModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Exporter</span>
    </button>
  </div>
</div>

<!-- MODAL CLEAR -->
<div class="modal-bg" id="clearModal">
  <div class="modal">
    <h2>Effacer l'image ?</h2>
    <p>Cette action supprime le dessin de l'image actuelle.</p>
    <div class="modal-btns">
      <button class="modal-btn secondary" onclick="closeModal('clearModal')">Annuler</button>
      <button class="modal-btn primary" onclick="clearFrame()">Effacer</button>
    </div>
  </div>
</div>

<!-- MODAL EXPORT -->
<div class="modal-bg" id="exportModal">
  <div class="modal">
    <h2>Exporter</h2>

    <!-- Options -->
    <div id="exportOpts">
      <p>Choisis le format d'export.</p>
      <div class="modal-btns" style="flex-direction:column;gap:10px">
        <button class="modal-btn primary"   onclick="exportPNG()">📷 Images PNG (toutes)</button>
        <button class="modal-btn secondary" onclick="startExportGIF()">🎞️ GIF animé</button>
        <button class="modal-btn secondary" onclick="startExportVideo()">🎬 Vidéo WebM</button>
        <button class="modal-btn secondary" onclick="closeModal('exportModal')">Fermer</button>
      </div>
    </div>

    <!-- Progress -->
    <div id="exportProg" style="display:none">
      <p id="exportProgLabel" style="color:var(--muted);font-size:0.85rem;margin-bottom:4px">Préparation...</p>
      <div class="progress-track"><div class="progress-fill" id="exportProgFill"></div></div>
      <p id="exportProgPercent" style="font-size:1rem;font-weight:700;color:var(--accent2);margin-top:6px">0 %</p>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// =============================================
//  DEUDÉ – ANIMATION 2D
//  Export GIF + Vidéo intégrés
// =============================================

// ---- STATE ----
let tool = 'pen', color = '#222222', bgColor = '#ffffff', brushSize = 4;
let onionOn = false, isPlaying = false, playTimer = null, currentFi = 0;
let frames = [], undoStack = [], redoStack = [];
let drawing = false, lastX = 0, lastY = 0, startX = 0, startY = 0, snapshot = null;

// ---- CANVAS ----
const bgCanvas    = document.getElementById('bgCanvas');
const onionCanvas = document.getElementById('onionCanvas');
const drawCanvas  = document.getElementById('drawCanvas');
const wrap        = document.getElementById('canvas-wrap');
const bctx        = bgCanvas.getContext('2d');
const octx        = onionCanvas.getContext('2d');
const ctx         = drawCanvas.getContext('2d', { willReadFrequently: true });
let CW = 0, CH = 0;

function resize() {
  const zone = document.getElementById('canvas-zone');
  const zW = zone.clientWidth - 24, zH = zone.clientHeight - 24;
  const ratio = 16 / 9;
  let w = zW, h = w / ratio;
  if (h > zH) { h = zH; w = h * ratio; }
  w = Math.floor(w); h = Math.floor(h);
  let saved = (CW && CH && frames.length) ? ctx.getImageData(0, 0, CW, CH) : null;
  CW = w; CH = h;
  [bgCanvas, drawCanvas, onionCanvas].forEach(c => {
    c.width = CW; c.height = CH;
    c.style.width = CW + 'px'; c.style.height = CH + 'px';
  });
  wrap.style.width = CW + 'px'; wrap.style.height = CH + 'px';
  if (saved) restoreFrame(currentFi); else initFrames();
}

function initFrames() {
  fillBgCanvas();
  ctx.clearRect(0, 0, CW, CH);
  frames = [ctx.getImageData(0, 0, CW, CH)];
  undoStack = [[]]; redoStack = [[]]; currentFi = 0;
  renderTimeline(); updateCounter();
}
function fillBgCanvas() { bctx.fillStyle = bgColor; bctx.fillRect(0, 0, CW, CH); }

// ---- TOOLS ----
function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const id = 'tool' + t.charAt(0).toUpperCase() + t.slice(1);
  document.getElementById(id)?.classList.add('active');
}
function setColor(v) { color = v; document.getElementById('colorSwatch').style.background = v; }
function setBgColor(v) { bgColor = v; fillBgCanvas(); renderTimeline(); showToast('Fond changé !'); }
function setSize(v)  { brushSize = parseInt(v); }

// ---- POINTER ----
function getPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * (CW / rect.width),
    y: (src.clientY - rect.top)  * (CH / rect.height)
  };
}
function onDown(e) {
  e.preventDefault();
  if (e.button === 2) return;
  drawing = true;
  const p = getPos(e);
  lastX = startX = p.x; lastY = startY = p.y;
  pushUndo();
  if (tool === 'fill') { floodFill(Math.round(p.x), Math.round(p.y), color); saveFrame(); return; }
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = brushSize; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (tool === 'pen' || tool === 'brush') {
    ctx.beginPath(); ctx.arc(p.x, p.y, brushSize / 2, 0, Math.PI * 2); ctx.fill();
  }
  if (['line','rect','circle'].includes(tool)) snapshot = ctx.getImageData(0, 0, CW, CH);
}
function onMove(e) {
  e.preventDefault();
  if (!drawing) return;
  const p = getPos(e);
  if (tool === 'pen') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color; ctx.lineWidth = brushSize; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
  } else if (tool === 'brush') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color; ctx.lineWidth = brushSize * 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = brushSize * 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  } else if (tool === 'line' && snapshot) {
    ctx.putImageData(snapshot, 0, 0);
    ctx.strokeStyle = color; ctx.lineWidth = brushSize; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(p.x, p.y); ctx.stroke();
  } else if (tool === 'rect' && snapshot) {
    ctx.putImageData(snapshot, 0, 0);
    ctx.strokeStyle = color; ctx.lineWidth = brushSize;
    ctx.strokeRect(startX, startY, p.x - startX, p.y - startY);
  } else if (tool === 'circle' && snapshot) {
    ctx.putImageData(snapshot, 0, 0);
    const rx = (p.x - startX) / 2, ry = (p.y - startY) / 2;
    ctx.strokeStyle = color; ctx.lineWidth = brushSize;
    ctx.beginPath(); ctx.ellipse(startX+rx, startY+ry, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI*2); ctx.stroke();
  }
  lastX = p.x; lastY = p.y;
}
function onUp() { if (!drawing) return; drawing = false; snapshot = null; saveFrame(); updateThumb(currentFi); }

drawCanvas.addEventListener('pointerdown', onDown, { passive: false });
drawCanvas.addEventListener('pointermove', onMove, { passive: false });
drawCanvas.addEventListener('pointerup',   onUp,   { passive: false });
drawCanvas.addEventListener('pointerout',  onUp,   { passive: false });
drawCanvas.addEventListener('contextmenu', e => e.preventDefault());

// ---- FLOOD FILL ----
function floodFill(sx, sy, fillHex) {
  const comp = document.createElement('canvas');
  comp.width = CW; comp.height = CH;
  const cc = comp.getContext('2d');
  cc.drawImage(bgCanvas, 0, 0); cc.drawImage(drawCanvas, 0, 0);
  const compData = cc.getImageData(0, 0, CW, CH);
  const imgData  = ctx.getImageData(0, 0, CW, CH);
  const d = imgData.data;
  const [tr,tg,tb,ta] = getPixelFrom(compData.data, sx, sy);
  const [fr,fg,fb]    = hexToRgb(fillHex);
  if (tr===fr && tg===fg && tb===fb) return;
  const stack = [[sx,sy]], visited = new Uint8Array(CW*CH);
  while (stack.length) {
    const [x,y] = stack.pop();
    if (x<0||x>=CW||y<0||y>=CH) continue;
    const i = y*CW+x; if (visited[i]) continue;
    const [pr,pg,pb,pa] = getPixelFrom(compData.data, x, y);
    if (!colorMatch(pr,pg,pb,pa,tr,tg,tb,ta)) continue;
    visited[i]=1; setPixel(d,x,y,fr,fg,fb,255);
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(imgData, 0, 0);
}
function getPixelFrom(d,x,y){ const i=(y*CW+x)*4; return [d[i],d[i+1],d[i+2],d[i+3]]; }
function setPixel(d,x,y,r,g,b,a){ const i=(y*CW+x)*4; d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=a; }
function colorMatch(r1,g1,b1,a1,r2,g2,b2,a2,t=12){
  return Math.abs(r1-r2)<t&&Math.abs(g1-g2)<t&&Math.abs(b1-b2)<t&&Math.abs(a1-a2)<t;
}
function hexToRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }

// ---- FRAMES ----
function saveFrame()   { frames[currentFi] = ctx.getImageData(0,0,CW,CH); }
function restoreFrame(i) {
  ctx.clearRect(0,0,CW,CH);
  if (frames[i]) ctx.putImageData(frames[i],0,0);
  drawOnion(i); updateCounter();
}
function addFrame() {
  saveFrame();
  const newId = ctx.createImageData(CW,CH);
  const ni = currentFi+1;
  frames.splice(ni,0,newId); undoStack.splice(ni,0,[]); redoStack.splice(ni,0,[]);
  goToFrame(ni); renderTimeline();
}
function deleteFrame(i,e) {
  e.stopPropagation();
  if (frames.length===1){ showToast('Impossible de supprimer la seule image !'); return; }
  frames.splice(i,1); undoStack.splice(i,1); redoStack.splice(i,1);
  const ni = Math.min(currentFi, frames.length-1);
  currentFi = -1; goToFrame(ni); renderTimeline();
}
function goToFrame(i) {
  if (i===currentFi) return;
  saveFrame(); currentFi = i; restoreFrame(i); renderTimeline(); updateCounter();
}
function goPrev() { if (currentFi>0) goToFrame(currentFi-1); }
function goNext() { if (currentFi<frames.length-1) goToFrame(currentFi+1); }
function updateCounter() { document.getElementById('frameCounter').textContent=`${currentFi+1} / ${frames.length}`; }

// ---- TIMELINE ----
function renderTimeline() {
  const list = document.getElementById('frames-list');
  list.innerHTML = '';
  frames.forEach((f,i) => {
    const div = document.createElement('div');
    div.className = 'frame-thumb' + (i===currentFi?' active':'');
    const tc = document.createElement('canvas');
    tc.width=54; tc.height=60;
    const tc2 = tc.getContext('2d');
    tc2.fillStyle = bgColor; tc2.fillRect(0,0,54,60);
    const tmp = document.createElement('canvas');
    tmp.width=CW; tmp.height=CH; tmp.getContext('2d').putImageData(f,0,0);
    tc2.drawImage(tmp,0,0,54,60);
    const num = document.createElement('span'); num.className='frame-num'; num.textContent=i+1;
    const del = document.createElement('button'); del.className='frame-del'; del.textContent='✕';
    del.onclick = e => deleteFrame(i,e);
    div.appendChild(tc); div.appendChild(num); div.appendChild(del);
    div.onclick = () => goToFrame(i);
    list.appendChild(div);
  });
}
function updateThumb(i) {
  const thumbs = document.querySelectorAll('.frame-thumb');
  if (!thumbs[i]) return;
  const tc = thumbs[i].querySelector('canvas');
  const tc2 = tc.getContext('2d');
  tc2.fillStyle = bgColor; tc2.fillRect(0,0,54,60);
  const tmp = document.createElement('canvas');
  tmp.width=CW; tmp.height=CH; tmp.getContext('2d').putImageData(frames[i],0,0);
  tc2.drawImage(tmp,0,0,54,60);
}

// ---- UNDO/REDO ----
function pushUndo() {
  undoStack[currentFi].push(ctx.getImageData(0,0,CW,CH));
  if (undoStack[currentFi].length>30) undoStack[currentFi].shift();
  redoStack[currentFi]=[];
}
function undo() {
  const s = undoStack[currentFi];
  if (!s||!s.length){ showToast('Rien à annuler'); return; }
  redoStack[currentFi].push(ctx.getImageData(0,0,CW,CH));
  ctx.putImageData(s.pop(),0,0); saveFrame(); updateThumb(currentFi);
}
function redo() {
  const s = redoStack[currentFi];
  if (!s||!s.length){ showToast('Rien à rétablir'); return; }
  undoStack[currentFi].push(ctx.getImageData(0,0,CW,CH));
  ctx.putImageData(s.pop(),0,0); saveFrame(); updateThumb(currentFi);
}

// ---- ONION SKIN ----
function toggleOnion(val) {
  if (typeof val==='boolean') onionOn=val; else onionOn=!onionOn;
  document.getElementById('onionCheck').checked=onionOn;
  drawOnion(currentFi);
}
function drawOnion(i) {
  octx.clearRect(0,0,CW,CH);
  if (!onionOn) return;
  const prev = frames[i-1];
  if (!prev) return;
  const tmp = document.createElement('canvas');
  tmp.width=CW; tmp.height=CH; tmp.getContext('2d').putImageData(prev,0,0);
  octx.globalAlpha=0.35; octx.drawImage(tmp,0,0); octx.globalAlpha=1;
  octx.globalAlpha=0.15; octx.fillStyle='#ff4466';
  octx.globalCompositeOperation='source-atop'; octx.fillRect(0,0,CW,CH);
  octx.globalCompositeOperation='source-over'; octx.globalAlpha=1;
}

// ---- PLAYBACK ----
function togglePlay() { isPlaying ? stopPlay() : startPlay(); }
function startPlay() {
  isPlaying=true;
  document.getElementById('playIcon').innerHTML='<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>';
  const fps = parseInt(document.getElementById('fpsInput').value)||8;
  saveFrame();
  playTimer = setInterval(() => {
    const ni = (currentFi+1)%frames.length;
    currentFi = ni; ctx.putImageData(frames[ni],0,0); drawOnion(ni); updateCounter();
    document.querySelectorAll('.frame-thumb').forEach((t,i)=>t.classList.toggle('active',i===ni));
  }, 1000/fps);
}
function stopPlay() {
  isPlaying=false; clearInterval(playTimer);
  document.getElementById('playIcon').innerHTML='<polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>';
  restoreFrame(currentFi); renderTimeline();
}

// ---- CLEAR ----
function confirmClear() { openModal('clearModal'); }
function clearFrame() {
  pushUndo(); ctx.clearRect(0,0,CW,CH); saveFrame(); updateThumb(currentFi); closeModal('clearModal');
}

// ============================================================
//  EXPORT — PROGRESS UI
// ============================================================
function showExportModal() { openModal('exportModal'); }

function setExportProgress(ratio, label) {
  document.getElementById('exportOpts').style.display    = 'none';
  document.getElementById('exportProg').style.display    = 'block';
  document.getElementById('exportProgLabel').textContent = label;
  document.getElementById('exportProgFill').style.width  = (ratio*100).toFixed(1)+'%';
  document.getElementById('exportProgPercent').textContent = Math.round(ratio*100)+' %';
}
function hideExportProgress() {
  document.getElementById('exportOpts').style.display = 'block';
  document.getElementById('exportProg').style.display = 'none';
  closeModal('exportModal');
}

// ---- PNG ----
function exportPNG() {
  saveFrame();
  frames.forEach((f,i) => {
    const tmp = document.createElement('canvas');
    tmp.width=CW; tmp.height=CH;
    const tc2 = tmp.getContext('2d');
    tc2.fillStyle=bgColor; tc2.fillRect(0,0,CW,CH); tc2.putImageData(f,0,0);
    const a = document.createElement('a');
    a.download=`deude_frame_${String(i+1).padStart(3,'0')}.png`;

  showToast(`${frames.length} image(s) exportée(s) !`);
}

// ============================================================
//  GIF ENCODER (pur JS, sans dépendance externe)
// ============================================================

/**
 * Quantification 5 bits/canal → palette 256 couleurs max.
 * Très rapide grâce au tableau de 32 768 entrées.
 */
function buildGIFPalette(pixels) {
  const n   = pixels.length / 4;
  const hist = new Uint32Array(32768);

  // 1. Compter les couleurs quantifiées (5 bits/canal)
  for (let p = 0; p < n; p++) {
    const i  = p*4;
    const k  = ((pixels[i]>>3)<<10)|((pixels[i+1]>>3)<<5)|(pixels[i+2]>>3);
    hist[k]++;
  }

  // 2. Trier par fréquence → top 256
  const top = [];
  for (let k = 0; k < 32768; k++) if (hist[k]) top.push([k, hist[k]]);
  top.sort((a,b) => b[1]-a[1]);

  const palette   = [];
  const palMapArr = new Int16Array(32768).fill(-1); // index ou -1

  const take = Math.min(256, top.length);
  for (let j = 0; j < take; j++) {
    const k = top[j][0];
    const r = ((k>>10)&31)<<3, g = ((k>>5)&31)<<3, b = (k&31)<<3;
    palMapArr[k] = j;
    palette.push([r|(r>>5), g|(g>>5), b|(b>>5)]); // 5→8 bits (arrondi)
  }

  // 3. Indexer les pixels
  const indexed = new Uint8Array(n);
  for (let p = 0; p < n; p++) {
    const i = p*4;
    const k = ((pixels[i]>>3)<<10)|((pixels[i+1]>>3)<<5)|(pixels[i+2]>>3);
    let idx = palMapArr[k];
    if (idx === -1) {
      // Couleur hors top-256 : cherche la plus proche
      let best=0, bestD=Infinity;
      for (let j=0; j<palette.length; j++) {
        const dr=pixels[i]-palette[j][0], dg=pixels[i+1]-palette[j][1], db=pixels[i+2]-palette[j][2];
        const d=dr*dr+dg*dg+db*db;
        if (d<bestD){ bestD=d; best=j; }
      }
      idx=best; palMapArr[k]=idx;
    }
    indexed[p]=idx;
  }

  // 4. Arrondir la palette à une puissance de 2
  let palBits=1;
  while ((1<<palBits)<palette.length) palBits++;
  palBits = Math.max(2, palBits);
  while (palette.length < (1<<palBits)) palette.push([0,0,0]);

  return { palette, indexed, palBits };
}

/**
 * Encodeur LZW GIF avec table de hachage epoch (évite de vider 1 Mo à chaque reset).
 */
const _LD  = new Int32Array(4096*256); // valeurs du dictionnaire
const _LE  = new Uint16Array(4096*256); // époque de chaque entrée
let   _LEV = 0;                         // époque courante

function lzwEncode(indexed, minCodeSize) {
  const clearCode = 1<<minCodeSize, eofCode = clearCode+1;
  const out = [];
  let bA=0, bN=0, cs=minCodeSize+1, nc=eofCode+1;

  _LEV = (_LEV+1) & 0xFFFF || 1;
  let ep = _LEV;

  const get = k => (_LE[k]===ep ? _LD[k] : -1);
  const set = (k,v) => { _LD[k]=v; _LE[k]=ep; };
  const reset = () => {
    ep = _LEV = (_LEV+1) & 0xFFFF || 1;
    nc=eofCode+1; cs=minCodeSize+1;
  };
  const emit = code => {
    bA |= code<<bN; bN += cs;
    while (bN>=8){ out.push(bA&0xFF); bA>>=8; bN-=8; }
  };

  emit(clearCode);
  let str = indexed[0];
  for (let i=1; i<indexed.length; i++) {
    const c=indexed[i], key=str*256+c, hit=get(key);
    if (hit!==-1) { str=hit; }
    else {
      emit(str);
      if (nc<=4095) { set(key,nc++); if (nc>(1<<cs)&&cs<12) cs++; }
      else { emit(clearCode); reset(); }
      str=c;
    }
  }
  emit(str); emit(eofCode);
  if (bN>0) out.push(bA&0xFF);
  return out;
}

/**
 * Composite fond + calque de dessin → pixels RGBA.
 */
function compositeFramePixels(fi) {
  const bgR=parseInt(bgColor.slice(1,3),16), bgG=parseInt(bgColor.slice(3,5),16), bgB=parseInt(bgColor.slice(5,7),16);
  const pixels = new Uint8ClampedArray(CW*CH*4);
  const draw   = frames[fi].data;
  for (let p=0; p<CW*CH; p++) {
    const i=p*4, a=draw[i+3]/255;
    pixels[i]   = Math.round(draw[i]   *a + bgR*(1-a));
    pixels[i+1] = Math.round(draw[i+1] *a + bgG*(1-a));
    pixels[i+2] = Math.round(draw[i+2] *a + bgB*(1-a));
    pixels[i+3] = 255;
  }
  return pixels;
}

/**
 * Construit le binaire GIF89a complet et retourne un Uint8Array.
 */
async function buildGIFData(fps, onProgress) {
  const delayCs = Math.max(2, Math.round(100/fps));

  // On accumule tout dans un tableau de tableaux par frame, puis on concatène
  const parts = [];
  const add   = arr => parts.push(arr);
  const w16   = v   => [v&0xFF, (v>>8)&0xFF];

  // En-tête GIF89a
  add([0x47,0x49,0x46,0x38,0x39,0x61]);

  // Logical Screen Descriptor (pas de Global Color Table)
  add([...w16(CW), ...w16(CH), 0x70, 0, 0]);

  // Extension Netscape (boucle infinie)
  add([0x21,0xFF,0x0B,
       78,69,84,83,67,65,80,69,50,46,48, // "NETSCAPE2.0"
       0x03,0x01,...w16(0),0x00]);

  for (let fi=0; fi<frames.length; fi++) {
    onProgress && onProgress(fi/frames.length, `Image ${fi+1}/${frames.length} — quantification`);
    await new Promise(r => setTimeout(r, 0)); // yield au navigateur

    const pixels = compositeFramePixels(fi);
    const { palette, indexed, palBits } = buildGIFPalette(pixels);
    const mcs = Math.max(2, palBits);

    onProgress && onProgress((fi+0.5)/frames.length, `Image ${fi+1}/${frames.length} — encodage LZW`);
    await new Promise(r => setTimeout(r, 0));

    // Graphic Control Extension
    add([0x21,0xF9,0x04,0x04,...w16(delayCs),0x00,0x00]);

    // Image Descriptor + Local Color Table
    add([0x2C,...w16(0),...w16(0),...w16(CW),...w16(CH), 0x80|(palBits-1)]);
    const palFlat = [];
    for (const [r,g,b] of palette) palFlat.push(r,g,b);
    add(palFlat);

    // Image Data
    const lzw = lzwEncode(indexed, mcs);
    add([mcs]);
    for (let i=0; i<lzw.length; i+=255) {
      const end = Math.min(i+255, lzw.length);
      const blk = [end-i];
      for (let j=i; j<end; j++) blk.push(lzw[j]);
      add(blk);
    }
    add([0x00]); // fin de bloc image
  }

  add([0x3B]); // Trailer

  // Concat
  let total = 0;
  for (const p of parts) total += p.length;
  const out = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

async function startExportGIF() {
  saveFrame();
  const fps = parseInt(document.getElementById('fpsInput').value)||8;

  setExportProgress(0, 'Démarrage…');

  try {
    const gifData = await buildGIFData(fps, (ratio, label) => setExportProgress(ratio, label));
    setExportProgress(1, 'Téléchargement…');
    await new Promise(r => setTimeout(r, 100));

    const blob = new Blob([gifData], { type: 'image/gif' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href=url; a.download='deude_animation.gif'; a.click();
    URL.revokeObjectURL(url);

    hideExportProgress();
    showToast('GIF exporté ! 🎞️');
  } catch(err) {
    hideExportProgress();
    showToast('Erreur GIF : '+err.message);
    console.error(err);
  }
}

// ============================================================
//  VIDEO EXPORT (MediaRecorder + captureStream)
// ============================================================
async function startExportVideo() {
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
    showToast('Votre navigateur ne supporte pas l\'export vidéo');
    return;
  }

  saveFrame();
  const fps = parseInt(document.getElementById('fpsInput').value)||8;
  const frameDuration = 1000/fps;

  setExportProgress(0, 'Initialisation de la capture vidéo…');

  // Canvas offscreen pour le rendu
  const off    = document.createElement('canvas');
  off.width=CW; off.height=CH;
  const offCtx = off.getContext('2d');

  const stream = off.captureStream(0); // 0 = manuel
  const track  = stream.getVideoTracks()[0];

  const mimes = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  const mime  = mimes.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';

  const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
  const chunks   = [];

  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href=url; a.download='deude_animation.webm'; a.click();
    URL.revokeObjectURL(url);
    hideExportProgress();
    showToast('Vidéo exportée ! 🎬');
  };

  recorder.start();

  for (let i=0; i<frames.length; i++) {
    setExportProgress(i/frames.length, `Image ${i+1}/${frames.length} — capture`);

    // Dessiner le frame sur le canvas offscreen
    offCtx.fillStyle = bgColor; offCtx.fillRect(0,0,CW,CH);
    const tmp = document.createElement('canvas');
    tmp.width=CW; tmp.height=CH; tmp.getContext('2d').putImageData(frames[i],0,0);
    offCtx.drawImage(tmp,0,0);

    track.requestFrame();                               // envoie le frame au recorder
    await new Promise(r => setTimeout(r, frameDuration)); // attend la durée du frame
  }

  // Répéter quelques frames pour éviter la coupure en fin
  for (let i=0; i<3; i++) {
    track.requestFrame();
    await new Promise(r => setTimeout(r, frameDuration));
  }

  recorder.stop();
}

// ---- MODALS ----
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ---- TOAST ----
let toastTimer;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

// ---- KEYBOARD ----
document.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(k==='p') setTool('pen');
  if(k==='b') setTool('brush');
  if(k==='e') setTool('eraser');
  if(k==='f') setTool('fill');
  if(k==='l') setTool('line');
  if(k==='r') setTool('rect');
  if(k==='c'&&!e.ctrlKey) setTool('circle');
  if(e.ctrlKey&&k==='z') undo();
  if(e.ctrlKey&&k==='y') redo();
  if(k===' '){ e.preventDefault(); togglePlay(); }
  if(k==='arrowleft')  goPrev();
  if(k==='arrowright') goNext();
});

// ---- INIT ----
window.addEventListener('resize', resize);
resize();
document.getElementById('colorSwatch').style.background = color;
showToast('Bienvenue dans Deudé ! 🎨');
