<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Deudé – Animation 2D</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #1a1a2e;
      --panel:    #16213e;
      --surface:  #0f3460;
      --accent:   #e94560;
      --accent2:  #f5a623;
      --text:     #eaeaea;
      --muted:    #7a8494;
      --border:   #2a3a5c;
      --radius:   10px;
      --toolbar-h: 56px;
      --bottom-h:  80px;
    }
    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    /* ===== LAYOUT ===== */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
    }

    /* ===== TOP TOOLBAR ===== */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      height: var(--toolbar-h);
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      flex-shrink: 0;
      z-index: 10;
    }
    #toolbar::-webkit-scrollbar { display: none; }

    .logo {
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent);
      margin-right: 8px;
      white-space: nowrap;
      text-shadow: 0 0 12px #e9456066;
    }

    .sep {
      width: 1px;
      height: 30px;
      background: var(--border);
      flex-shrink: 0;
      margin: 0 4px;
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 44px;
      height: 40px;
      border: none;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      font-size: 0.6rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.1s;
      flex-shrink: 0;
      padding: 0 6px;
      -webkit-tap-highlight-color: transparent;
    }
    .tool-btn svg { flex-shrink: 0; }
    .tool-btn:hover  { background: var(--surface); color: var(--text); }
    .tool-btn:active { transform: scale(0.92); }
    .tool-btn.active { background: var(--accent); color: #fff; box-shadow: 0 0 10px #e9456055; }
    .tool-btn.active2 { background: var(--surface); color: var(--accent2); }

    /* color swatch */
    #colorSwatch {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 3px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.2s;
      overflow: hidden;
      position: relative;
    }
    #colorSwatch:hover { border-color: var(--accent); }
    #colorSwatch input[type=color] {
      position: absolute; inset: -4px; width: 140%; height: 140%;
      opacity: 0; cursor: pointer; border: none; padding: 0;
    }

    /* size slider */
    .size-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .size-group label { font-size: 0.65rem; color: var(--muted); white-space: nowrap; }
    input[type=range] {
      -webkit-appearance: none;
      width: 70px; height: 4px;
      background: var(--surface);
      border-radius: 2px; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
    }

    /* ===== MAIN AREA ===== */
    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* ===== CANVAS ZONE ===== */
    #canvas-zone {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, #1e2a45 0%, var(--bg) 100%);
      overflow: hidden;
      position: relative;
    }

    #canvas-wrap {
      position: relative;
      box-shadow: 0 8px 40px #00000088;
      border-radius: 4px;
      overflow: hidden;
      border: 2px solid var(--border);
    }

    /* 3 couches : fond blanc → pelure → dessin */
    #bgCanvas, #onionCanvas, #drawCanvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
    }
    #bgCanvas    { z-index: 1; }   /* fond blanc fixe */
    #onionCanvas { z-index: 2; }   /* image précédente semi-transparente */
    #drawCanvas  { z-index: 3; background: transparent; } /* dessin actuel */

    #canvas-wrap { display: block; }

    /* ===== TIMELINE / FRAMES (bottom) ===== */
    #timeline {
      height: var(--bottom-h);
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      flex-shrink: 0;
    }

    .frame-thumb {
      flex-shrink: 0;
      width: 54px;
      height: 60px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }
    .frame-thumb:hover  { border-color: var(--accent2); transform: translateY(-2px); }
    .frame-thumb.active { border-color: var(--accent); box-shadow: 0 0 10px #e9456066; }
    .frame-thumb canvas { width: 100%; height: 100%; display: block; }
    .frame-num {
      position: absolute; bottom: 2px; right: 4px;
      font-size: 0.55rem; color: var(--muted);
      background: #000a; padding: 1px 3px; border-radius: 3px;
    }
    .frame-del {
      position: absolute; top: 1px; right: 1px;
      font-size: 0.6rem; line-height: 1;
      background: var(--accent); color: #fff;
      border: none; border-radius: 3px;
      padding: 1px 3px; cursor: pointer;
      display: none;
    }
    .frame-thumb:hover .frame-del { display: block; }

    #addFrameBtn {
      flex-shrink: 0;
      width: 46px; height: 60px;
      border-radius: 6px;
      border: 2px dashed var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 1.6rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    #addFrameBtn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ===== PLAYBACK BAR ===== */
    #playbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .play-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .play-btn:hover  { background: #c73450; }
    .play-btn:active { transform: scale(0.9); }

    #fpsLabel { font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
    #fpsInput {
      width: 38px; font-size: 0.75rem;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 4px; text-align: center;
    }
    #frameCounter { font-size: 0.72rem; color: var(--muted); margin-left: 4px; }

    .spacer { flex: 1; }

    /* export btn */
    #exportBtn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 12px;
      border-radius: var(--radius);
      border: none;
      background: var(--surface);
      color: var(--accent2);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    #exportBtn:hover { background: #1a4a7a; }

    /* ===== MODAL ===== */
    .modal-bg {
      display: none;
      position: fixed; inset: 0;
      background: #000b;
      z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      max-width: 320px;
      width: 90%;
      text-align: center;
    }
    .modal h2 { margin-bottom: 12px; color: var(--accent2); }
    .modal p  { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
    .modal-btns { display: flex; gap: 10px; justify-content: center; }
    .modal-btn {
      padding: 8px 18px; border-radius: 8px; border: none;
      font-size: 0.85rem; cursor: pointer; font-weight: 600;
    }
    .modal-btn.primary { background: var(--accent); color: #fff; }
    .modal-btn.secondary { background: var(--surface); color: var(--text); }

    /* ===== TOAST ===== */
    #toast {
      position: fixed; bottom: 110px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #222e; color: #fff;
      padding: 8px 18px; border-radius: 20px;
      font-size: 0.8rem; pointer-events: none;
      opacity: 0; transition: opacity 0.3s, transform 0.3s;
      z-index: 200; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      :root { --toolbar-h: 50px; --bottom-h: 70px; }
      .logo { font-size: 1.05rem; }
      .tool-btn { min-width: 38px; font-size: 0.55rem; }
      #exportBtn span { display: none; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- TOP TOOLBAR -->
  <div id="toolbar">
    <span class="logo">Deudé</span>
    <div class="sep"></div>

    <!-- TOOLS -->
    <button class="tool-btn active" id="toolPen" title="Crayon" onclick="setTool('pen')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Crayon
    </button>
    <button class="tool-btn" id="toolBrush" title="Pinceau" onclick="setTool('brush')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 114.03 4.03l-8.06 8.08"/><path d="M7.07 14.94C5.79 16.2 4 16.72 2 17c.5-2 1.06-3.8 2.38-5.07"/></svg>
      Pinceau
    </button>
    <button class="tool-btn" id="toolLine" title="Ligne" onclick="setTool('line')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="19" x2="19" y2="5"/></svg>
      Ligne
    </button>
    <button class="tool-btn" id="toolRect" title="Rectangle" onclick="setTool('rect')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      Rect
    </button>
    <button class="tool-btn" id="toolCircle" title="Cercle" onclick="setTool('circle')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/></svg>
      Cercle
    </button>
    <button class="tool-btn" id="toolFill" title="Remplissage" onclick="setTool('fill')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 11l-8-8-8.5 8.5a5.5 5.5 0 007.78 7.78L19 11z"/><path d="M20 23a2 2 0 000-4c-.5 0-1.1.5-2 1.5s-.5 2.5.5 2.5a2 2 0 001.5 0z"/></svg>
      Fill
    </button>
    <button class="tool-btn" id="toolEraser" title="Gomme" onclick="setTool('eraser')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 20H7L3 16l11-11 6 6-3.5 3.5"/><path d="M6.07 7.07L19 20"/></svg>
      Gomme
    </button>

    <div class="sep"></div>

    <!-- COLOR -->
    <div id="colorSwatch" title="Couleur">
      <input type="color" id="colorPicker" value="#222222" onchange="setColor(this.value)" oninput="setColor(this.value)">
    </div>

    <!-- BG color -->
    <button class="tool-btn" id="bgColorBtn" title="Couleur fond" onclick="document.getElementById('bgPicker').click()" style="position:relative">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="20" height="20" rx="3"/></svg>
      Fond
      <input type="color" id="bgPicker" value="#ffffff" onchange="setBgColor(this.value)" style="position:absolute;inset:0;opacity:0;cursor:pointer">
    </button>

    <div class="sep"></div>

    <!-- SIZE -->
    <div class="size-group">
      <label>Taille</label>
      <input type="range" id="sizeSlider" min="1" max="60" value="4" oninput="setSize(this.value)">
    </div>

    <div class="sep"></div>

    <!-- UNDO/REDO -->
    <button class="tool-btn" title="Annuler" onclick="undo()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
      Annuler
    </button>
    <button class="tool-btn" title="Rétablir" onclick="redo()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 009-9 9 9 0 016 2.3L21 13"/></svg>
      Rétablir
    </button>

    <!-- CLEAR -->
    <button class="tool-btn" title="Effacer l'image" onclick="confirmClear()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      Effacer
    </button>

    <!-- ONION -->
    <button class="tool-btn" id="onionBtn" title="Pelure d'oignon" onclick="toggleOnion()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><ellipse cx="12" cy="12" rx="8" ry="10"/><ellipse cx="12" cy="12" rx="4" ry="6"/></svg>
      Pelure
    </button>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="canvas-zone">
      <div id="canvas-wrap">
        <canvas id="bgCanvas"></canvas>
        <canvas id="onionCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>
  </div>

  <!-- TIMELINE -->
  <div id="timeline">
    <div id="frames-list" style="display:flex;gap:8px;align-items:center;"></div>
    <button id="addFrameBtn" title="Ajouter une image" onclick="addFrame()">+</button>
  </div>

  <!-- PLAYBACK BAR -->
  <div id="playbar">
    <button class="play-btn" id="prevBtn" title="Image précédente" onclick="goPrev()" style="background:var(--surface);color:var(--text)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="4" x2="5" y2="20" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="play-btn" id="playBtn" title="Lecture" onclick="togglePlay()">
      <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
    <button class="play-btn" id="nextBtn" title="Image suivante" onclick="goNext()" style="background:var(--surface);color:var(--text)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="4" x2="19" y2="20" stroke="currentColor" stroke-width="2"/></svg>
    </button>

    <span id="frameCounter">1 / 1</span>

    <span class="spacer"></span>

    <label id="fpsLabel">
      FPS
      <input type="number" id="fpsInput" min="1" max="30" value="8">
    </label>

    <!-- ONION toggle mini -->
    <span id="fpsLabel" style="font-size:0.7rem;color:var(--muted)">Pelure</span>
    <label style="display:flex;align-items:center;cursor:pointer;gap:4px">
      <input type="checkbox" id="onionCheck" onchange="toggleOnion(this.checked)" style="accent-color:var(--accent2)">
    </label>

    <span class="spacer"></span>

    <button id="exportBtn" title="Exporter" onclick="showExportModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Exporter</span>
    </button>
  </div>
</div>

<!-- MODAL CONFIRM CLEAR -->
<div class="modal-bg" id="clearModal">
  <div class="modal">
    <h2>Effacer l'image ?</h2>
    <p>Cette action supprime le dessin de l'image actuelle. Elle est irréversible.</p>
    <div class="modal-btns">
      <button class="modal-btn secondary" onclick="closeModal('clearModal')">Annuler</button>
      <button class="modal-btn primary" onclick="clearFrame()">Effacer</button>
    </div>
  </div>
</div>

<!-- MODAL EXPORT -->
<div class="modal-bg" id="exportModal">
  <div class="modal">
    <h2>Exporter</h2>
    <p>Choisis le format d'export de ton animation.</p>
    <div class="modal-btns" style="flex-direction:column;gap:10px">
      <button class="modal-btn primary" onclick="exportPNG()">📷 Toutes les images (PNG)</button>
      <button class="modal-btn secondary" onclick="exportGIF()">🎞️ GIF animé (beta)</button>
      <button class="modal-btn secondary" onclick="closeModal('exportModal')">Fermer</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// =============================================
//  DEUDÉ – ANIMATION 2D
//  © 2025 – Projet scolaire
// =============================================

// ---- STATE ----
let tool        = 'pen';
let color       = '#222222';
let bgColor     = '#ffffff';
let brushSize   = 4;
let onionOn     = false;
let isPlaying   = false;
let playTimer   = null;
let currentFi   = 0;     // current frame index
let frames      = [];    // array of ImageData
let undoStack   = [];    // per-frame undo stacks
let redoStack   = [];

// Drawing state
let drawing = false;
let lastX   = 0, lastY = 0;
let startX  = 0, startY = 0;
let snapshot = null;      // for shape previews

// ---- CANVAS SETUP ----
const bgCanvas    = document.getElementById('bgCanvas');
const onionCanvas = document.getElementById('onionCanvas');
const drawCanvas  = document.getElementById('drawCanvas');
const wrap        = document.getElementById('canvas-wrap');
const bctx        = bgCanvas.getContext('2d');
const octx        = onionCanvas.getContext('2d');
const ctx         = drawCanvas.getContext('2d', { willReadFrequently: true });

let CW = 0, CH = 0;

function resize() {
  const zone  = document.getElementById('canvas-zone');
  const zW    = zone.clientWidth  - 24;
  const zH    = zone.clientHeight - 24;
  const ratio = 16 / 9;

  let w = zW;
  let h = w / ratio;
  if (h > zH) { h = zH; w = h * ratio; }

  w = Math.floor(w);
  h = Math.floor(h);

  // Save current frame
  let saved = null;
  if (CW && CH && frames.length) {
    saved = ctx.getImageData(0, 0, CW, CH);
  }
  CW = w; CH = h;

  [bgCanvas, drawCanvas, onionCanvas].forEach(c => {
    c.width  = CW;
    c.height = CH;
    c.style.width  = CW + 'px';
    c.style.height = CH + 'px';
  });
  wrap.style.width  = CW + 'px';
  wrap.style.height = CH + 'px';

  if (saved) {
    restoreFrame(currentFi);
  } else {
    initFrames();
  }
}

function initFrames() {
  fillBgCanvas();
  ctx.clearRect(0, 0, CW, CH);  // drawCanvas transparent
  const id = ctx.getImageData(0, 0, CW, CH);
  frames      = [id];
  undoStack   = [[]];
  redoStack   = [[]];
  currentFi   = 0;
  renderTimeline();
  updateCounter();
}

function fillBg(c) {
  c.fillStyle = bgColor;
  c.fillRect(0, 0, CW, CH);
}

function fillBgCanvas() {
  bctx.fillStyle = bgColor;
  bctx.fillRect(0, 0, CW, CH);
}

// ---- TOOLS ----
function setTool(t) {
  tool = t;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tool' + t.charAt(0).toUpperCase() + t.slice(1))?.classList.add('active');
}

function setColor(v) {
  color = v;
  document.getElementById('colorSwatch').style.background = v;
}

function setBgColor(v) {
  bgColor = v;
  // Re-apply bg on blank frames
  showToast('Fond changé – s\'applique aux nouvelles images');
}

function setSize(v) {
  brushSize = parseInt(v);
}

// ---- POINTER EVENTS ----
function getPos(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * (CW / rect.width),
    y: (src.clientY - rect.top)  * (CH / rect.height)
  };
}

function onDown(e) {
  e.preventDefault();
  if (e.button === 2) return;
  drawing  = true;
  const p  = getPos(e);
  lastX = startX = p.x;
  lastY = startY = p.y;
  pushUndo();

  if (tool === 'fill') {
    floodFill(Math.round(p.x), Math.round(p.y), color);
    saveFrame();
    return;
  }

  ctx.strokeStyle = color;
  ctx.fillStyle   = color;
  ctx.lineWidth   = brushSize;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  if (tool === 'pen' || tool === 'brush') {
    ctx.beginPath();
    ctx.arc(p.x, p.y, brushSize / 2, 0, Math.PI * 2);
    ctx.fill();
  }

  if (['line','rect','circle'].includes(tool)) {
    snapshot = ctx.getImageData(0, 0, CW, CH);
  }
}

function onMove(e) {
  e.preventDefault();
  if (!drawing) return;
  const p = getPos(e);

  if (tool === 'pen') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.lineWidth   = brushSize;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  else if (tool === 'brush') {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = color;
    ctx.lineWidth   = brushSize * 2.5;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  else if (tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = brushSize * 2;
    ctx.lineCap   = 'round';
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  else if (tool === 'line' && snapshot) {
    ctx.putImageData(snapshot, 0, 0);
    ctx.strokeStyle = color;
    ctx.lineWidth   = brushSize;
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  else if (tool === 'rect' && snapshot) {
    ctx.putImageData(snapshot, 0, 0);
    ctx.strokeStyle = color;
    ctx.lineWidth   = brushSize;
    ctx.strokeRect(startX, startY, p.x - startX, p.y - startY);
  }
  else if (tool === 'circle' && snapshot) {
    ctx.putImageData(snapshot, 0, 0);
    const rx = (p.x - startX) / 2;
    const ry = (p.y - startY) / 2;
    ctx.strokeStyle = color;
    ctx.lineWidth   = brushSize;
    ctx.beginPath();
    ctx.ellipse(startX + rx, startY + ry, Math.abs(rx), Math.abs(ry), 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  lastX = p.x; lastY = p.y;
}

function onUp(e) {
  if (!drawing) return;
  drawing = false;
  snapshot = null;
  saveFrame();
  updateThumb(currentFi);
}

// Touch
drawCanvas.addEventListener('pointerdown', onDown, { passive: false });
drawCanvas.addEventListener('pointermove', onMove, { passive: false });
drawCanvas.addEventListener('pointerup',   onUp,   { passive: false });
drawCanvas.addEventListener('pointerout',  onUp,   { passive: false });
drawCanvas.addEventListener('contextmenu', e => e.preventDefault());

// ---- FLOOD FILL ----
function floodFill(sx, sy, fillColorHex) {
  // Composite bg + dessin pour lire les vraies couleurs visibles
  const composite = document.createElement('canvas');
  composite.width = CW; composite.height = CH;
  const cc = composite.getContext('2d');
  cc.drawImage(bgCanvas, 0, 0);
  cc.drawImage(drawCanvas, 0, 0);
  const compData = cc.getImageData(0, 0, CW, CH);

  // On dessine sur drawCanvas uniquement
  const imgData = ctx.getImageData(0, 0, CW, CH);
  const d       = imgData.data;
  const [tr, tg, tb, ta] = getPixelFrom(compData.data, sx, sy);
  const [fr, fg, fb]     = hexToRgb(fillColorHex);

  if (tr === fr && tg === fg && tb === fb) return;

  const stack   = [[sx, sy]];
  const visited = new Uint8Array(CW * CH);

  while (stack.length) {
    const [x, y] = stack.pop();
    if (x < 0 || x >= CW || y < 0 || y >= CH) continue;
    const i = y * CW + x;
    if (visited[i]) continue;
    const [pr, pg, pb, pa] = getPixelFrom(compData.data, x, y);
    if (!colorMatch(pr, pg, pb, pa, tr, tg, tb, ta)) continue;
    visited[i] = 1;
    setPixel(d, x, y, fr, fg, fb, 255);
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
  ctx.putImageData(imgData, 0, 0);
}

function getPixelFrom(data, x, y) {
  const i = (y * CW + x) * 4;
  return [data[i], data[i+1], data[i+2], data[i+3]];
}

function getPixel(d, x, y) {
  return getPixelFrom(d, x, y);
}
function setPixel(d, x, y, r, g, b, a) {
  const i = (y * CW + x) * 4;
  d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=a;
}
function colorMatch(r1,g1,b1,a1,r2,g2,b2,a2,tol=12) {
  return Math.abs(r1-r2)<tol&&Math.abs(g1-g2)<tol&&Math.abs(b1-b2)<tol&&Math.abs(a1-a2)<tol;
}
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

// ---- FRAMES ----
function saveFrame() {
  frames[currentFi] = ctx.getImageData(0, 0, CW, CH);
}

function restoreFrame(i) {
  ctx.clearRect(0, 0, CW, CH);
  if (frames[i]) ctx.putImageData(frames[i], 0, 0);
  drawOnion(i);
  updateCounter();
}

function addFrame() {
  saveFrame();
  // Nouvelle image transparente
  const newId = ctx.createImageData(CW, CH);
  // pixels à 0 = transparent par défaut
  const newIndex = currentFi + 1;
  frames.splice(newIndex, 0, newId);
  undoStack.splice(newIndex, 0, []);
  redoStack.splice(newIndex, 0, []);
  goToFrame(newIndex);
  renderTimeline();
}

function deleteFrame(i, e) {
  e.stopPropagation();
  if (frames.length === 1) { showToast('Impossible de supprimer la seule image !'); return; }
  frames.splice(i, 1);
  undoStack.splice(i, 1);
  redoStack.splice(i, 1);
  const ni = Math.min(currentFi, frames.length - 1);
  currentFi = -1; // force refresh
  goToFrame(ni);
  renderTimeline();
}

function goToFrame(i) {
  if (i === currentFi) return;
  saveFrame();
  currentFi = i;
  restoreFrame(i);
  renderTimeline();
  updateCounter();
}

function goPrev() {
  if (currentFi > 0) goToFrame(currentFi - 1);
}
function goNext() {
  if (currentFi < frames.length - 1) goToFrame(currentFi + 1);
}

function updateCounter() {
  document.getElementById('frameCounter').textContent =
    `${currentFi + 1} / ${frames.length}`;
}

// ---- TIMELINE RENDER ----
function renderTimeline() {
  const list = document.getElementById('frames-list');
  list.innerHTML = '';
  frames.forEach((f, i) => {
    const div = document.createElement('div');
    div.className = 'frame-thumb' + (i === currentFi ? ' active' : '');
    div.title = `Image ${i + 1}`;

    const tc = document.createElement('canvas');
    tc.width  = 54;
    tc.height = 60;
    const tc2 = tc.getContext('2d');
    // fond blanc
    tc2.fillStyle = bgColor;
    tc2.fillRect(0, 0, 54, 60);
    // dessin de la frame
    const tmp = document.createElement('canvas');
    tmp.width = CW; tmp.height = CH;
    tmp.getContext('2d').putImageData(f, 0, 0);
    tc2.drawImage(tmp, 0, 0, 54, 60);

    const num  = document.createElement('span');
    num.className = 'frame-num';
    num.textContent = i + 1;

    const del  = document.createElement('button');
    del.className = 'frame-del';
    del.textContent = '✕';
    del.onclick = (e) => deleteFrame(i, e);

    div.appendChild(tc);
    div.appendChild(num);
    div.appendChild(del);
    div.onclick = () => goToFrame(i);
    list.appendChild(div);
  });
}

function updateThumb(i) {
  const thumbs = document.querySelectorAll('.frame-thumb');
  if (!thumbs[i]) return;
  const tc  = thumbs[i].querySelector('canvas');
  const tc2 = tc.getContext('2d');
  tc2.fillStyle = bgColor;
  tc2.fillRect(0, 0, 54, 60);
  const tmp = document.createElement('canvas');
  tmp.width = CW; tmp.height = CH;
  tmp.getContext('2d').putImageData(frames[i], 0, 0);
  tc2.drawImage(tmp, 0, 0, 54, 60);
}

// ---- UNDO / REDO ----
function pushUndo() {
  undoStack[currentFi].push(ctx.getImageData(0, 0, CW, CH));
  if (undoStack[currentFi].length > 30) undoStack[currentFi].shift();
  redoStack[currentFi] = [];
}

function undo() {
  const stack = undoStack[currentFi];
  if (!stack || stack.length === 0) { showToast('Rien à annuler'); return; }
  redoStack[currentFi].push(ctx.getImageData(0, 0, CW, CH));
  ctx.putImageData(stack.pop(), 0, 0);
  saveFrame();
  updateThumb(currentFi);
}

function redo() {
  const stack = redoStack[currentFi];
  if (!stack || stack.length === 0) { showToast('Rien à rétablir'); return; }
  undoStack[currentFi].push(ctx.getImageData(0, 0, CW, CH));
  ctx.putImageData(stack.pop(), 0, 0);
  saveFrame();
  updateThumb(currentFi);
}

// ---- ONION SKIN ----
function toggleOnion(val) {
  if (typeof val === 'boolean') onionOn = val;
  else onionOn = !onionOn;
  document.getElementById('onionCheck').checked = onionOn;
  drawOnion(currentFi);
}

function drawOnion(i) {
  octx.clearRect(0, 0, CW, CH);
  if (!onionOn) return;

  // Image précédente en rouge/bleu translucide
  const prev = frames[i - 1];
  if (prev) {
    const tmp = document.createElement('canvas');
    tmp.width = CW; tmp.height = CH;
    const tc  = tmp.getContext('2d');
    tc.putImageData(prev, 0, 0);

    // Teinte rouge pour distinguer la pelure du dessin actuel
    octx.globalAlpha = 0.35;
    octx.drawImage(tmp, 0, 0);
    octx.globalAlpha = 1;

    // Overlay rouge léger pour coloriser
    octx.globalAlpha = 0.15;
    octx.fillStyle = '#ff4466';
    octx.globalCompositeOperation = 'source-atop';
    octx.fillRect(0, 0, CW, CH);
    octx.globalCompositeOperation = 'source-over';
    octx.globalAlpha = 1;
  }
}

// ---- PLAYBACK ----
function togglePlay() {
  isPlaying ? stopPlay() : startPlay();
}

function startPlay() {
  isPlaying = true;
  document.getElementById('playIcon').innerHTML =
    '<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>';
  const fps = parseInt(document.getElementById('fpsInput').value) || 8;
  saveFrame();
  playTimer = setInterval(() => {
    const ni = (currentFi + 1) % frames.length;
    currentFi = ni;
    ctx.putImageData(frames[ni], 0, 0);
    drawOnion(ni);
    updateCounter();
    // highlight thumb
    document.querySelectorAll('.frame-thumb').forEach((t, i) => {
      t.classList.toggle('active', i === ni);
    });
  }, 1000 / fps);
}

function stopPlay() {
  isPlaying = false;
  clearInterval(playTimer);
  document.getElementById('playIcon').innerHTML =
    '<polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>';
  restoreFrame(currentFi);
  renderTimeline();
}

// ---- CLEAR ----
function confirmClear() { openModal('clearModal'); }

function clearFrame() {
  pushUndo();
  ctx.clearRect(0, 0, CW, CH);
  saveFrame();
  updateThumb(currentFi);
  closeModal('clearModal');
}

// ---- EXPORT ----
function showExportModal() { openModal('exportModal'); }

function exportPNG() {
  saveFrame();
  frames.forEach((f, i) => {
    const tmp = document.createElement('canvas');
    tmp.width = CW; tmp.height = CH;
    const tc2 = tmp.getContext('2d');
    // fond + dessin
    tc2.fillStyle = bgColor;
    tc2.fillRect(0, 0, CW, CH);
    tc2.putImageData(f, 0, 0);
    const a = document.createElement('a');
    a.download = `deude_frame_${String(i+1).padStart(3,'0')}.png`;
    a.href = tmp.toDataURL('image/png');
    a.click();
  });
  closeModal('exportModal');
  showToast(`${frames.length} image(s) exportée(s) !`);
}

function exportGIF() {
  showToast('Export GIF – bientôt disponible !');
  closeModal('exportModal');
}

// ---- MODALS ----
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ---- TOAST ----
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ---- KEYBOARD SHORTCUTS ----
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'p') setTool('pen');
  if (k === 'b') setTool('brush');
  if (k === 'e') setTool('eraser');
  if (k === 'f') setTool('fill');
  if (k === 'l') setTool('line');
  if (k === 'r') setTool('rect');
  if (k === 'c' && !e.ctrlKey) setTool('circle');
  if (e.ctrlKey && k === 'z') undo();
  if (e.ctrlKey && k === 'y') redo();
  if (k === ' ') { e.preventDefault(); togglePlay(); }
  if (k === 'arrowleft')  goPrev();
  if (k === 'arrowright') goNext();
});

// ---- INIT ----
window.addEventListener('resize', resize);
resize();
document.getElementById('colorSwatch').style.background = color;
showToast('Bienvenue dans Deudé ! 🎨');
</script>
